appId: com.littlellm.companion
productName: LittleLLM
directories:
  output: dist
files:
  - out/**
  - assets/**
  - package.json
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/koffi/**
  - node_modules/@koromix/**
win:
  executableName: LittleLLM
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: LittleLLM
  runAfterFinish: true
